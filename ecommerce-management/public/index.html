<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase — Store</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
  <div class="brand">🛍️ ShopEase</div>
  <nav>
    <a onclick="showSection('home')">Home</a>
    <a onclick="showSection('orders')">My Orders</a>
    <button class="btn secondary" onclick="openCart()">Cart (<span id="cart-count">0</span>)</button>
    <span id="auth-area"></span>
  </nav>
</div>

<div class="hero" id="hero">
  <h1>Everything you need, all in one place</h1>
  <p>Quality products, fast checkout, real order tracking.</p>
</div>

<div class="container" id="home-section">
  <div class="filters">
    <input type="text" id="search-input" placeholder="Search products...">
    <select id="category-select"><option value="">All Categories</option></select>
    <select id="sort-select">
      <option value="">Sort by</option>
      <option value="price_asc">Price: Low to High</option>
      <option value="price_desc">Price: High to Low</option>
      <option value="newest">Newest</option>
    </select>
  </div>
  <div class="grid" id="products-grid"></div>
</div>

<div class="container" id="orders-section" style="display:none">
  <h2>My Orders</h2>
  <div id="orders-list"></div>
</div>

<!-- Cart Modal -->
<div class="modal-overlay" id="cart-modal">
  <div class="modal">
    <span class="close-x" onclick="closeModal('cart-modal')">&times;</span>
    <h2>Your Cart</h2>
    <div id="cart-items"></div>
    <div class="cart-total"><span>Total</span><span id="cart-total">$0.00</span></div>
    <label>Shipping Address</label>
    <textarea id="shipping-address" placeholder="123 Main St, City, Country"></textarea>
    <div class="actions">
      <button class="btn secondary" onclick="closeModal('cart-modal')">Continue Shopping</button>
      <button class="btn" onclick="checkout()">Checkout</button>
    </div>
  </div>
</div>

<!-- Auth Modal -->
<div class="modal-overlay" id="auth-modal">
  <div class="modal">
    <span class="close-x" onclick="closeModal('auth-modal')">&times;</span>
    <h2 id="auth-title">Login</h2>
    <div id="register-fields" style="display:none">
      <label>Name</label>
      <input type="text" id="reg-name">
    </div>
    <label>Email</label>
    <input type="email" id="auth-email">
    <label>Password</label>
    <input type="password" id="auth-password">
    <div class="actions" style="justify-content: space-between; align-items:center;">
      <a onclick="toggleAuthMode()" style="font-size:13px;color:var(--primary);cursor:pointer">
        <span id="auth-toggle-text">Need an account? Register</span>
      </a>
      <button class="btn" onclick="submitAuth()">Submit</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
